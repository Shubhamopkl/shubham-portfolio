<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Shubham Patel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #D4AF37;
            --bg: #0a0a0a;
            --card-bg: #141414;
            --text: #ffffff;
            --text-muted: #888;
            --border: #333;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
        }
        aside {
            width: 250px;
            background: var(--card-bg);
            height: 100vh;
            border-right: 1px solid var(--border);
            position: fixed;
            display: flex;
            flex-direction: column;
        }
        .logo {
            padding: 30px;
            font-family: 'Cinzel', serif;
            font-size: 24px;
            color: var(--primary);
            text-align: center;
            border-bottom: 1px solid var(--border);
        }
        nav {
            flex: 1;
            padding: 20px 0;
        }
        nav a {
            display: flex;
            align-items: center;
            padding: 15px 30px;
            color: var(--text-muted);
            text-decoration: none;
            transition: 0.3s;
        }
        nav a i { margin-right: 15px; }
        nav a:hover, nav a.active {
            color: var(--primary);
            background: rgba(212, 175, 55, 0.1);
        }
        .logout-btn {
            padding: 20px;
            text-align: center;
            border-top: 1px solid var(--border);
            cursor: pointer;
            color: #ff4d4d;
        }
        main {
            margin-left: 250px;
            flex: 1;
            padding: 40px;
            max-width: 1200px;
        }
        section { display: none; }
        section.active { display: block; }
        h1 { font-family: 'Cinzel', serif; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .form-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 30px;
        }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 14px; }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid var(--border);
            border-radius: 4px;
            color: #fff;
            box-sizing: border-box;
        }
        input:focus, textarea:focus { border-color: var(--primary); outline: none; }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.3s;
        }
        .btn-primary { background: var(--primary); color: #000; }
        .btn-primary:hover { background: #f3e5ab; }
        .btn-danger { background: #ff4d4d; color: #fff; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            text-align: left;
            padding: 15px;
            border-bottom: 1px solid var(--border);
        }
        th { color: var(--primary); font-family: 'Cinzel', serif; }
        .msg-row:hover { background: rgba(255,255,255,0.02); }
        
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }
        .item-img {
            width: 100%;
            height: 150px;
            background-size: cover;
            background-position: center;
        }
        .item-info { padding: 15px; }
        .item-actions {
            padding: 15px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 8px;
            width: 100%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .close-modal { cursor: pointer; font-size: 24px; }
    </style>
</head>
<body>
    <aside>
        <div class="logo">SHUBHAM</div>
        <nav>
            <a href="#hero" class="active" data-section="hero-section"><i class="fas fa-home"></i> Hero Section</a>
            <a href="#about" data-section="about-section"><i class="fas fa-user"></i> About Section</a>
            <a href="#portfolio" data-section="portfolio-section"><i class="fas fa-th-large"></i> Portfolio Items</a>
            <a href="#messages" data-section="messages-section"><i class="fas fa-envelope"></i> Messages</a>
        </nav>
        <div class="logout-btn" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</div>
    </aside>

    <main>
        <!-- Hero Section Management -->
        <section id="hero-section" class="active">
            <h1>Manage Hero Section</h1>
            <div class="form-card">
                <form id="hero-form">
                    <div class="form-group">
                        <label>Main Title</label>
                        <input type="text" id="hero-title" required>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="hero-desc" rows="4" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Typing Roles (Comma separated)</label>
                        <input type="text" id="hero-roles" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Update Hero Section</button>
                </form>
            </div>
        </section>

        <!-- About Section Management -->
        <section id="about-section">
            <h1>Manage About Section</h1>
            <div class="form-card">
                <form id="about-form">
                    <div class="form-group">
                        <label>Bio Lead (Quote)</label>
                        <input type="text" id="about-lead" required>
                    </div>
                    <div class="form-group">
                        <label>Bio Text 1</label>
                        <textarea id="about-text1" rows="4" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Bio Text 2</label>
                        <textarea id="about-text2" rows="4" required></textarea>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px;">
                        <div class="form-group">
                            <label>Exp Years</label>
                            <input type="text" id="about-exp" required>
                        </div>
                        <div class="form-group">
                            <label>Projects Count</label>
                            <input type="text" id="about-projects" required>
                        </div>
                        <div class="form-group">
                            <label>Match Rating</label>
                            <input type="text" id="about-match" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Portrait Image URL</label>
                        <input type="text" id="about-portrait" required>
                        <input type="file" class="image-upload" data-target="about-portrait" style="margin-top: 10px;">
                    </div>
                    <button type="submit" class="btn btn-primary">Update About Section</button>
                </form>
            </div>
        </section>

        <!-- Portfolio Management -->
        <section id="portfolio-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h1>Manage Portfolio</h1>
                <button class="btn btn-primary" id="add-item-btn"><i class="fas fa-plus"></i> Add New Item</button>
            </div>
            <div class="portfolio-grid" id="portfolio-list">
                <!-- Items populated by JS -->
            </div>
        </section>

        <!-- Messages Management -->
        <section id="messages-section">
            <h1>Contact Form Messages</h1>
            <div class="form-card">
                <table id="messages-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Subject</th>
                            <th>Message</th>
                        </tr>
                    </thead>
                    <tbody id="messages-list">
                        <!-- Messages populated by JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Portfolio Item Modal -->
    <div class="modal" id="portfolio-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Add Portfolio Item</h2>
                <span class="close-modal">&times;</span>
            </div>
            <form id="portfolio-form">
                <input type="hidden" id="item-id">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="item-title" required>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="item-category">
                            <option value="Trending Now">Trending Now</option>
                            <option value="Award-Winning Masterpieces">Award-Winning Masterpieces</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="item-desc" rows="3" required></textarea>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label>Logo Text</label>
                        <input type="text" id="item-logo" required>
                    </div>
                    <div class="form-group">
                        <label>Year</label>
                        <input type="text" id="item-year" required>
                    </div>
                    <div class="form-group">
                        <label>Match Score</label>
                        <input type="text" id="item-match" required>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label>Maturity Rating</label>
                        <input type="text" id="item-maturity" required>
                    </div>
                    <div class="form-group">
                        <label>Tags (Comma separated)</label>
                        <input type="text" id="item-tags" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Image URL</label>
                    <input type="text" id="item-img-url" required>
                    <input type="file" class="image-upload" data-target="item-img-url" style="margin-top: 10px;">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label>GitHub URL</label>
                        <input type="text" id="item-github">
                    </div>
                    <div class="form-group">
                        <label>Live URL</label>
                        <input type="text" id="item-live">
                    </div>
                </div>
                <div class="form-group">
                    <label>Commands (JSON string for terminal)</label>
                    <textarea id="item-commands" rows="4"></textarea>
                    <small style="color: #888;">Format: [{"type":"prompt","text":"..."}, {"type":"success","text":"..."}]</small>
                </div>
                <button type="submit" class="btn btn-primary">Save Item</button>
            </form>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
